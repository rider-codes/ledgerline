# Render Blueprint for Ledgerline — see DEPLOY.md.
# One web service with a persistent disk for the SQLite database and session secret.
# A persistent disk needs a paid instance type, and a service with a disk runs as a single instance.
services:
  - type: web
    name: ledgerline
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ledgerline-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true # Render creates a random secret once and keeps it
      - key: DEMO_MODE
        value: "true" # one-click sandbox with sample data; set to "false" for a private install
      - key: DEMO_ONLY
        value: "true" # public showcase: no sign-up or sign-in, so no one's real finances reach the server. "false" = real accounts allowed
      - key: DEMO_ANTHROPIC_API_KEY
        sync: false # a secret: Render asks for it in the dashboard, it is never stored in git. Leave empty for no demo AI.
      - key: GITHUB_URL
        value: https://github.com/rider-codes/ledgerline # the landing page's Fork / View buttons
      - key: AI_BACKEND
        value: rules
      - key: EMBED_ENABLED
        value: "false"
      - key: CURRENCY
        value: "₹"
