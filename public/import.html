<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import CSV · Ledgerline</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=16">
</head>
<body data-page="import">
  <div class="layout">
    <nav id="side"></nav>
    <div id="main">
      <div class="topbar"><h1>Import CSV</h1><span class="sub">Bring in a bank or card export</span></div>
      <div class="content">
        <div class="card" style="max-width:820px;width:100%;margin:0 auto;">

          <div class="row" id="steps" style="gap:12px;margin-bottom:18px;font-size:13px;">
            <span data-s="1" class="row" style="gap:8px;"><b class="mono step-n">1</b> Upload</span>
            <span style="flex:1;height:1px;background:var(--line-2);"></span>
            <span data-s="2" class="row" style="gap:8px;color:var(--text-3);"><b class="mono step-n">2</b> Map columns</span>
            <span style="flex:1;height:1px;background:var(--line-2);"></span>
            <span data-s="3" class="row" style="gap:8px;color:var(--text-3);"><b class="mono step-n">3</b> Done</span>
          </div>

          <!-- step 1 -->
          <div id="step1">
            <label id="drop" style="display:flex;flex-direction:column;align-items:center;gap:10px;border:1px dashed var(--line-2);border-radius:12px;padding:40px;cursor:pointer;text-align:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
              <div><b>Drop a .csv file here</b><div class="muted" style="font-size:12.5px;">or click to choose · max 6 MB</div></div>
              <input type="file" id="file" accept=".csv,text/csv" hidden>
            </label>
            <div class="row" style="gap:14px;margin-top:14px;font-size:12.5px;">
              <span class="muted">No file handy?</span>
              <a href="#" data-sample="sample-bank-export.csv">Try a bank export</a>
              <a href="#" data-sample="sample-card-export.csv">Try a card export</a>
            </div>
          </div>

          <!-- step 2 -->
          <div id="step2" hidden class="stepbody">
            <div class="row" style="gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;">
              <span class="mono" id="file-name" style="flex:1;font-size:13px;"></span>
              <a href="#" id="restart">Replace</a>
            </div>
            <div>
              <div class="eyebrow" style="margin-bottom:10px;">Match your columns</div>
              <div id="mapping" style="display:flex;flex-direction:column;gap:8px;"></div>
              <div class="row" id="posmeans" style="gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-2);">
                Positive amounts are
                <select id="pos" style="padding:4px 8px;font-size:12px;"><option value="income">income</option><option value="expense">expense (charges)</option></select>
              </div>
            </div>
            <div>
              <div class="eyebrow" style="margin-bottom:10px;">Preview</div>
              <div class="scroll-x"><table class="tbl" id="preview"></table></div>
            </div>
          </div>

          <!-- step 3 -->
          <div id="step3" hidden></div>

        </div>
      </div>
      <div class="composer" id="footer" hidden>
        <div class="spread" style="max-width:820px;margin:0 auto;width:100%;">
          <span class="muted" id="foot-info" style="font-size:12.5px;"></span>
          <div class="row"><button class="btn ghost" id="back">Back</button><button class="btn primary" id="commit">Import</button></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/config.js"></script>
  <script src="/assets/shell.js?v=13"></script>
  <script src="/assets/import.js?v=7"></script>
</body>
</html>
