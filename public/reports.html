<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Ledgerline</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=18">
</head>
<body data-page="reports">
  <div class="layout">
    <nav id="side"></nav>
    <div id="main">
      <div class="topbar">
        <div class="row" style="align-items:baseline;gap:12px;"><h1>Reports</h1><span class="sub">Where the money comes from and goes</span></div>
        <label class="row" style="gap:6px;"><span class="eyebrow">Month</span><select id="month"></select></label>
      </div>

      <div class="row" id="rtabs" style="gap:24px;padding:0 24px;border-bottom:1px solid var(--line);background:#0e1116;">
        <button class="rtab" data-tab="cashflow">Cash Flow</button>
        <button class="rtab" data-tab="spending">Spending</button>
        <button class="rtab" data-tab="income">Income</button>
      </div>

      <div class="content">
        <div class="kpis" id="kpis" style="grid-template-columns:repeat(4,1fr);"></div>
        <div id="report-body"></div>
      </div>
    </div>
  </div>
  <script src="/assets/config.js"></script>
  <script src="/assets/shell.js?v=11"></script>
  <script src="/assets/reports.js?v=8"></script>
</body>
</html>
