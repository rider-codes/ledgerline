<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerline</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=16">
</head>
<body data-page="dashboard">
  <div class="layout">
    <nav id="side"></nav>
    <div id="main">
      <div class="topbar">
        <div class="row" style="align-items:baseline;gap:12px;">
          <h1>Dashboard</h1><span class="sub">Overview of your spending</span>
        </div>
        <div class="row">
          <label class="row" style="gap:6px;">
            <span class="eyebrow">Period</span>
            <select id="month"></select>
          </label>
          <a class="btn primary" href="/import">Import CSV</a>
        </div>
      </div>

      <div class="content">
          <div class="kpis" id="kpis"></div>

          <div class="grid cols-main">
            <div class="card">
              <div class="spread" style="margin-bottom:4px;">
                <div><h3>Spending over time</h3><div class="sub" id="time-sub">Last 6 months</div></div>
                <div class="seg" id="time-mode"><button data-m="monthly" class="on">Monthly</button><button data-m="daily">Daily</button></div>
              </div>
              <div id="chart-time"></div>
            </div>
            <div class="card">
              <div class="spread" style="margin-bottom:12px;"><h3>By category</h3><span class="sub" id="cat-month"></span></div>
              <div id="chart-cat"></div>
            </div>
          </div>

          <div class="grid cols-2">
            <div class="card"><h3 style="margin-bottom:12px;">Top merchants</h3><div id="merchants"></div></div>
            <div class="card">
              <div class="spread" style="margin-bottom:12px;"><h3>Recent transactions</h3><a href="/transactions" class="sub">View all</a></div>
              <div id="recent"></div>
            </div>
          </div>
        </div>
    </div>
  </div>
  <script src="/assets/config.js"></script>
  <script src="/assets/shell.js?v=14"></script>
  <script src="/assets/dashboard.js?v=9"></script>
</body>
</html>
