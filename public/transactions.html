<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerline</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/styles.css?v=16">
</head>
<body data-page="transactions">
  <div class="layout">
    <nav id="side"></nav>
    <div id="main">
      <div class="topbar">
        <h1>Transactions</h1>
        <div class="row">
          <input id="q" class="topsearch" placeholder="Search merchant…">
          <button class="btn primary" id="add-btn">+ Add transaction</button>
        </div>
      </div>

      <div class="split">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
          <div class="row filters">
            <label class="row" style="gap:6px;"><span class="eyebrow">Month</span><select id="f-month"></select></label>
            <label class="row" style="gap:6px;"><span class="eyebrow">Category</span><select id="f-cat"></select></label>
            <label class="row" style="gap:6px;"><span class="eyebrow">Type</span>
              <select id="f-type"><option value="">All</option><option value="expense">Expense</option><option value="income">Income</option></select>
            </label>
            <span class="muted" id="count" style="margin-left:auto;font-size:12px;"></span>
          </div>
          <div class="content" style="flex:1;">
            <div class="scroll-x"><table class="tbl" id="tbl"><tbody></tbody></table></div>
            <div id="empty" class="empty" hidden>No transactions match these filters.</div>
          </div>
        </div>

        <aside class="side-panel">
          <div class="eyebrow" style="margin-bottom:10px;">Summary</div>
          <div id="summary"></div>
        </aside>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <script src="/assets/config.js"></script>
  <script src="/assets/shell.js?v=14"></script>
  <script src="/assets/transactions.js?v=5"></script>
</body>
</html>
